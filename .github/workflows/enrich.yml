name: enrich

# Discount plans and brand logos for the web (the geoportal refuses browsers from
# other origins). Daily, one batch of stations, into the orphan branch
# `enrichment`; the pages workflow publishes it under data/. See
# tools/enrich/enrich.py.
#
# Not weekly and all at once: on 28 September 2026 the geoportal slowed a full
# run from 1 s to 25 s per request after ~9,000 stations, and the job was killed
# at 5 hours with nothing written. 2,500 stations a day stay well below that.

on:
  schedule:
    - cron: '41 3 * * *'   # every day, about 05:41 in Spain
  workflow_dispatch:
    inputs:
      batch:
        description: 'Stations to ask, least recently asked first (default 2500)'
        required: false

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # enrich.py stops asking at 60 min (--budget-min) and logos at 70, then writes
    # what it has; a batch normally takes about 15. A killed job writes nothing.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out the enrichment branch
        run: |
          git config --global user.name "PabloSoage"
          git config --global user.email "p.soage@udc.es"
          if git ls-remote --exit-code --heads origin enrichment >/dev/null; then
            git fetch origin enrichment:enrichment
            git worktree add enrichment-wt enrichment
          else
            git worktree add --detach enrichment-wt
            cd enrichment-wt
            git checkout --orphan enrichment
            git rm -rf --quiet . || true
          fi

      - name: Plans and logos
        env:
          BATCH: ${{ github.event.inputs.batch }}
        run: python -u tools/enrich/enrich.py --out enrichment-wt ${BATCH:+--batch "$BATCH"}

      - name: Commit and push
        working-directory: enrichment-wt
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          covered=$(python -c 'import json; d = json.load(open("plans.json", encoding="utf-8")); print(d["covered"], d["total"], sep="/")')
          git commit --quiet -m "Plans and logos of $(date -u +%F): $covered stations covered"
          git push origin enrichment
