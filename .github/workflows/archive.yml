name: archive

# Phase 3: one compact snapshot per day of every station's prices, committed to
# the orphan branch `archive`. See tools/archive/snapshot.py.
#
# On 26 and 27 September 2026 the Ministry's server reset every connection: at
# times it accepts only TLS 1.2 ciphers with RSA key exchange, which Python no
# longer offers by default (see tls_context in snapshot.py). On top of that fix,
# snapshot.py retries for about 12 minutes and fills in any day of the last week
# that is missing.

on:
  schedule:
    - cron: '17 5 * * *'   # about 07:17 in Spain; archives yesterday
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to archive, dd-mm-yyyy (default: yesterday, Europe/Madrid)'
        required: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out the archive branch
        run: |
          git config --global user.name "PabloSoage"
          git config --global user.email "p.soage@udc.es"
          if git ls-remote --exit-code --heads origin archive >/dev/null; then
            git fetch origin archive:archive
            git worktree add archive-wt archive
          else
            git worktree add --detach archive-wt
            cd archive-wt
            git checkout --orphan archive
            git rm -rf --quiet . || true
          fi

      - name: Snapshot
        env:
          DAY: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$DAY" ]; then
            python tools/archive/snapshot.py --out archive-wt --date "$DAY"
          else
            python tools/archive/snapshot.py --out archive-wt
          fi

      # Also after a failed snapshot: the days that did arrive are kept, and the run
      # still shows red for the ones that did not (the next run retries them).
      - name: Commit and push
        if: ${{ !cancelled() }}
        working-directory: archive-wt
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          days=$(git diff --cached --name-only --diff-filter=AM -- prices | xargs -rn1 basename | cut -d. -f1 | sort | paste -sd, - | sed 's/,/, /g')
          git commit --quiet -m "Prices of ${days:-no new day}"
          git push origin archive
